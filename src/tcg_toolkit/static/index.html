<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title data-i18n="tcg_toolkit_search"></title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="./theme.css" rel="stylesheet"/>
<link href="./style.css" rel="stylesheet"/>
<script src="./auth.js" type="module"></script>
</head>
<body class="signed-out">
<aside>
<a class="brand" href="./"><i class="bi bi-stack"></i><span data-i18n="tcg"></span><span data-i18n="toolkit"></span></a>
<nav id="app-nav" hidden><a aria-current="page" href="#search"><i class="bi bi-search"></i><span data-i18n="search"></span></a><a href="#favorites"><i class="bi bi-star"></i><span data-i18n="favorites"></span></a></nav>
<div id="app-settings" class="sidebar-settings" hidden>
<label class="setting" data-i18n-title="language"><i class="bi bi-globe2"></i><select data-i18n-aria-label="language" id="language"><option data-i18n="english" value="en"></option><option data-i18n="chinese" value="zh-CN"></option></select></label>
<label class="setting" data-i18n-title="display_currency"><i class="bi bi-currency-exchange"></i><select id="currency" data-i18n-aria-label="display_currency"><option value="JPY" data-i18n="currency_jpy"></option><option value="CNY" data-i18n="currency_cny"></option><option value="CAD" data-i18n="currency_cad"></option></select></label>
<span id="currency-status" role="status" aria-live="polite" hidden></span>
</div>
<div id="user-bar" class="sidebar-user" hidden>
<a href="#account" id="account-link" class="user-link"><span class="avatar" id="user-avatar" aria-hidden="true"></span><span class="user-meta"><span id="current-username"></span><span class="user-sub" data-i18n="auth_account"></span></span></a>
</div>
</aside>
<main id="auth-panel">
<label class="auth-language"><i class="bi bi-globe2"></i><select id="auth-language" data-i18n-aria-label="language"><option value="en">English</option><option value="zh-CN">简体中文</option></select></label>
<div class="auth-wrap">
<div class="brand auth-brand"><i class="bi bi-stack"></i><span data-i18n="tcg"></span><span data-i18n="toolkit"></span></div>
<section class="panel auth-card">
<h1 id="auth-heading"></h1>
<form id="auth-form">
<label class="field"><span data-i18n="auth_username"></span><span class="input-icon"><i class="bi bi-person"></i><input id="auth-username" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_\-]+" required aria-describedby="auth-rules"/></span></label>
<label class="field"><span data-i18n="auth_password"></span><span class="input-icon"><i class="bi bi-lock"></i><input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="18" required aria-describedby="auth-rules"/><button id="password-toggle" class="password-toggle" type="button" aria-pressed="false"><i class="bi bi-eye"></i></button></span></label>
<label class="field" id="auth-confirm-field" hidden><span data-i18n="auth_confirm_password"></span><span class="input-icon"><i class="bi bi-shield-lock"></i><input id="auth-confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="18"/><i id="confirm-state" class="confirm-state" aria-hidden="true"></i></span></label>
<p id="auth-rules" data-i18n="auth_rules" hidden></p>
<p id="auth-error" role="alert"></p>
<button id="auth-submit" type="submit" disabled></button>
<button id="auth-switch" type="button" class="text-button"></button>
</form>
</section>
</div>
</main>
<main id="account-panel" hidden>
<header><h1 data-i18n="auth_account"></h1></header>
<section class="panel profile-card">
<span class="avatar avatar-lg" id="account-avatar" aria-hidden="true"></span>
<div class="profile-meta"><h2 id="account-username"></h2><p><i class="bi bi-calendar3"></i><span data-i18n="auth_created"></span><time id="account-created"></time></p></div>
<div class="profile-actions">
<button id="logout" type="button" class="secondary"><i class="bi bi-box-arrow-right"></i><span data-i18n="auth_logout"></span></button>
<span id="account-status" role="alert"></span>
</div>
</section>
<div class="account-grid">
<section class="panel account-card"><span class="account-icon"><i class="bi bi-person-vcard"></i></span><h2 data-i18n="auth_profile"></h2><span class="soon" data-i18n="auth_coming"></span></section>
<section class="panel account-card"><span class="account-icon"><i class="bi bi-shield-lock"></i></span><h2 data-i18n="auth_security"></h2><span class="soon" data-i18n="auth_coming"></span></section>
<section class="panel account-card"><span class="account-icon"><i class="bi bi-sliders"></i></span><h2 data-i18n="auth_preferences"></h2><span class="soon" data-i18n="auth_coming"></span></section>
</div>
</main>
<main id="search" hidden>
<header><h1 data-i18n="search"></h1></header>
<section class="panel">
<form id="search-form">
<div class="search-line">
<div class="input-icon" id="keyword-wrapper">
<i class="bi bi-search"></i>
<input autocomplete="off" data-i18n-aria-label="keyword" data-i18n-placeholder="card_name_or_number" id="keyword" required="" aria-expanded="false" aria-controls="search-history"/>
<div id="search-history" hidden><div class="history-header"><div class="history-heading" data-i18n="search_history"></div><button type="button" id="history-clear" class="text-button" data-i18n="history_clear"></button></div><div id="history-items"></div><p id="history-empty"><i class="bi bi-clock-history"></i><span data-i18n="history_empty"></span></p></div>
</div>
<button id="search-button" type="submit"><i class="bi bi-arrow-right"></i><span data-i18n="search"></span></button>
<button class="secondary" hidden="" id="stop" type="button"><i class="bi bi-stop-fill"></i><span data-i18n="stop"></span></button>
</div>
<div class="chips" data-i18n-aria-label="games_to_search" role="group">
<label class="chip"><input checked="" name="source" type="checkbox" value="chaos"/><i class="bi bi-check-lg"></i><span data-i18n="chaostcg"></span></label>
<label class="chip"><input checked="" name="source" type="checkbox" value="lycee"/><i class="bi bi-check-lg"></i><span data-i18n="lycee"></span></label>
<label class="chip"><input checked="" name="source" type="checkbox" value="pm"/><i class="bi bi-check-lg"></i><span data-i18n="pm"></span></label>
<label class="chip"><input checked="" name="source" type="checkbox" value="ws"/><i class="bi bi-check-lg"></i><span data-i18n="ws"></span></label>
<label class="chip"><input checked="" name="source" type="checkbox" value="wsr"/><i class="bi bi-check-lg"></i><span data-i18n="wsr"></span></label>
</div>
</form>
</section>
<section class="results">

<div class="section-heading">
<div class="heading-left">
<h2 data-i18n="results"></h2>
<span class="count" id="counts">0 / 0</span>
<span aria-live="polite" id="status" role="status"></span>
</div>
<div class="heading-actions"><div class="view-toggle" data-i18n-aria-label="view" role="group"><button type="button" class="icon-button" data-view="list" data-i18n-aria-label="list_view" data-i18n-title="list_view"><i class="bi bi-list-ul"></i></button><button type="button" class="icon-button" data-view="grid" data-i18n-aria-label="grid_view" data-i18n-title="grid_view"><i class="bi bi-grid-3x3-gap"></i></button></div></div>
</div>
<div id="errors" role="alert"></div>
<div id="search-filters"></div>
<div class="panel table-panel" id="list-view">
<div class="table-scroll"><table><thead><tr><th data-i18n="game"></th><th data-i18n="rarity"></th><th data-i18n="number"></th><th data-i18n="name"></th><th class="numeric" data-i18n="price"></th><th data-i18n="stock"></th><th class="action-col"><span class="sr-only" data-i18n="favorites"></span></th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<div class="card-grid" hidden="" id="grid-view"></div>
<div class="empty" id="empty"><i class="bi bi-search"></i><h3 data-i18n="no_results"></h3></div>
<div class="more-wrap"><button class="secondary" hidden="" id="more"><i class="bi bi-chevron-down"></i><span data-i18n="show_more"></span></button></div>
</section>
</main>
<main id="favorites-panel" hidden>
<header><h1 data-i18n="favorites"></h1></header>
<section class="results">
<div class="section-heading">
<div class="heading-left"><h2 data-i18n="favorite_cards"></h2><span class="count" id="favorites-count" hidden></span><span id="favorites-status" role="status" aria-live="polite"></span></div>
<div class="heading-actions"><button id="favorites-refresh" type="button" class="secondary compact"><i class="bi bi-arrow-clockwise"></i><span data-i18n="favorite_refresh_all"></span></button><div class="view-toggle" data-i18n-aria-label="view" role="group"><button type="button" class="icon-button" data-view="list" data-i18n-aria-label="list_view" data-i18n-title="list_view"><i class="bi bi-list-ul"></i></button><button type="button" class="icon-button" data-view="grid" data-i18n-aria-label="grid_view" data-i18n-title="grid_view"><i class="bi bi-grid-3x3-gap"></i></button></div></div>
</div>
<div class="progress" id="favorites-progress" hidden><div class="progress-bar" id="favorites-progress-bar"></div></div>
<button id="favorites-retry" type="button" class="secondary" hidden><i class="bi bi-arrow-counterclockwise"></i><span data-i18n="favorite_retry"></span></button>
<div id="favorites-filters"></div>
<div class="panel table-panel" id="favorites-list">
<div class="table-scroll"><table><thead><tr><th data-i18n="game"></th><th data-i18n="rarity"></th><th data-i18n="number"></th><th data-i18n="name"></th><th class="numeric" data-i18n="price"></th><th data-i18n="stock"></th><th class="action-col"><span class="sr-only" data-i18n="favorites"></span></th></tr></thead><tbody id="favorites-rows"></tbody></table></div>
</div>
<div id="favorites-grid" class="card-grid" hidden></div>
<div id="favorites-empty" class="empty" hidden><i class="bi bi-star"></i><h3></h3></div>
</section>
</main>
<template id="filter-panel">
<div class="panel filters">
<div class="filter-top">
<h3><i class="bi bi-funnel"></i><span data-i18n="filters"></span></h3>
<button class="text-button" data-role="reset" type="button"><i class="bi bi-arrow-counterclockwise"></i><span data-i18n="reset"></span></button>
</div>
<div class="filter-search input-icon">
<i class="bi bi-search"></i>
<input data-i18n-aria-label="find" data-i18n-placeholder="name_or_number" data-role="text" type="search"/>
</div>
<div class="filter-grid">
<label class="field"><span data-i18n="rarity"></span><select data-role="rarity"><option value="" data-i18n="all"></option></select></label>
<label class="field"><span data-i18n="stock"></span><select data-role="stock"><option data-i18n="all" value=""></option><option data-i18n="in_stock" value="in_stock"></option><option data-i18n="out_of_stock" value="out_of_stock"></option><option data-i18n="unknown" value="unknown"></option></select></label>
<label class="field"><span data-i18n="sort"></span><select data-role="sort"><option data-i18n="default" value="original"></option><option data-i18n="price_ascending" value="price:asc"></option><option data-i18n="price_descending" value="price:desc"></option><option data-i18n="name_a_z" value="name:asc"></option><option data-i18n="name_z_a" value="name:desc"></option><option data-i18n="number_ascending" value="card_number:asc"></option><option data-i18n="number_descending" value="card_number:desc"></option><option data-i18n="quantity_ascending" value="stock_quantity:asc"></option><option data-i18n="quantity_descending" value="stock_quantity:desc"></option></select></label>
<div class="field price-field" role="group" data-i18n-aria-label="price_range">
<div class="price-head"><span data-i18n="price_range"></span><output data-role="price-label"></output></div>
<div class="range" data-role="price-range">
<div class="range-track"><div class="range-fill" data-role="price-fill"></div></div>
<input type="range" data-role="price-min" min="0" max="0" step="1" value="0" data-i18n-aria-label="min_price"/>
<input type="range" data-role="price-max" min="0" max="0" step="1" value="0" data-i18n-aria-label="max_price"/>
</div>
</div>
</div>
<div class="chips" data-i18n-aria-label="games_to_show" role="group">
<label class="chip"><input checked="" data-role="game" type="checkbox" value="chaos"/><i class="bi bi-check-lg"></i><span data-i18n="chaostcg"></span></label>
<label class="chip"><input checked="" data-role="game" type="checkbox" value="lycee"/><i class="bi bi-check-lg"></i><span data-i18n="lycee"></span></label>
<label class="chip"><input checked="" data-role="game" type="checkbox" value="pm"/><i class="bi bi-check-lg"></i><span data-i18n="pm"></span></label>
<label class="chip"><input checked="" data-role="game" type="checkbox" value="ws"/><i class="bi bi-check-lg"></i><span data-i18n="ws"></span></label>
<label class="chip"><input checked="" data-role="game" type="checkbox" value="wsr"/><i class="bi bi-check-lg"></i><span data-i18n="wsr"></span></label>
</div>
</div>
</template>
<dialog id="image-dialog" class="image-dialog" aria-labelledby="preview-name">
<button type="button" id="preview-close" class="icon-button preview-close" data-i18n-aria-label="close" data-i18n-title="close"><i class="bi bi-x-lg"></i></button>
<figure><div class="preview-frame"><img id="preview-image" alt=""/><i class="bi bi-arrow-repeat spin preview-spinner" aria-hidden="true"></i></div>
<figcaption><span id="preview-name"></span><span id="preview-number" class="mono"></span></figcaption></figure>
</dialog>
<dialog id="detail-dialog" aria-labelledby="detail-title" aria-describedby="detail-description">
<h2 id="detail-title" data-i18n="detail_title"></h2>
<p id="detail-description" data-i18n="detail_description"></p>
<p id="detail-name"></p><p id="detail-url"></p>
<div class="dialog-actions">
<button type="button" id="detail-cancel" class="secondary" autofocus data-i18n="detail_cancel"></button>
<a id="detail-confirm" target="_blank" rel="noopener noreferrer" data-i18n="detail_confirm"></a>
</div>
</dialog>
</body>
</html>
