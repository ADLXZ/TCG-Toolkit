services:
  web:
    build: .
    environment:
      RAPIDAPI_KEY: "${RAPIDAPI_KEY:-}"
      TCG_CURRENCY_CACHE: /app/data/currency.sqlite3
    volumes:
      - currency-data:/app/data
    ports:
      - "127.0.0.1:${TCG_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  currency-data:

networks:
  default:
    ipam:
      config:
        - subnet: "${TCG_SUBNET:-10.203.0.0/24}"
