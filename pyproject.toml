[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcg-toolkit"
version = "0.1.0"
description = "Normalized YuYu-Tei card search"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
